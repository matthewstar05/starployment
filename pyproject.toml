[project]
name = "jobhub"
version = "0.3.0"
description = "Native desktop job-application hub: configure, scan, rank, tailor, apply."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "playwright>=1.45",
    "python-jobspy>=1.1.75",
    "pypdf>=4.2",
    "reportlab>=4.2",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pyside6>=6.8,<7",
    "keyring>=25.0,<26",
    "fonttools[woff]>=4.50 ; sys_platform == 'win32'",
]

[project.scripts]
jobhub = "jobhub.cli:main"
jobhub-desktop = "jobhub.desktop.__main__:main"
jobhub-setup = "jobhub.desktop.__main__:setup_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhub"]

[dependency-groups]
dev = [
    "pyinstaller>=6.16,<7",
    "pytest>=9.1.1",
]
